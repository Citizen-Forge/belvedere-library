id: core/network-interface
name: Network Interface
root: hardware
extends: core/hardware
icon: network-interface
description: A physical network interface (NIC) on a piece of hardware, hosted by that hardware and physically connected (CONNECTS_TO) to a switch.
version: 0.1.0
attributes:
  - key: macAddress
    label: MAC address
    dataType: string
  - key: ipAddress
    label: IP address
    dataType: string
  - key: speedGbps
    label: Speed
    dataType: number
    unit: Gbps
